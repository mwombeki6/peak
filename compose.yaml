services:
  grafana-lgtm:
    image: 'grafana/otel-lgtm:latest'
    profiles:
      - observability
    ports:
      - '3000:3000'
      - '4317'
      - '4318'
  postgres:
    image: 'postgres:18.4@sha256:b913fd5699b8bd23fa4b06d72ecdd939fad43b80fb8651bac06caa0e6d135cac'
    environment:
      - 'POSTGRES_DB=peak'
      - 'POSTGRES_PASSWORD=peak_migrator'
      - 'POSTGRES_USER=peak_migrator'
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U peak_migrator -d peak']
      interval: 10s
      timeout: 5s
      retries: 5
  # Backs both peak.reporting.storage and peak.verification.storage locally — each points at
  # its own bucket on this one instance, matching how the app itself only ever knows "a
  # private S3-compatible endpoint" and never anything MinIO-specific.
  minio:
    image: 'minio/minio:RELEASE.2025-04-22T22-12-26Z'
    command: server /data --console-address ":9001"
    environment:
      - 'MINIO_ROOT_USER=peak'
      - 'MINIO_ROOT_PASSWORD=peak-development-secret'
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
  # Backs peak.verification.malware-scan locally. Slow to become healthy on first start —
  # freshclam has to pull virus definitions — so most local/CI runs simply leave
  # PEAK_VERIFICATION_MALWARE_SCAN_ENABLED unset and never start this profile.
  clamav:
    image: 'clamav/clamav:1.4'
    profiles:
      - malware-scan
    ports:
      - '3310:3310'
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
