name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Podman Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-compose

      - name: Validate production compose
        run: |
          podman compose --env-file ops/production/.env.example -f ops/production/compose.yaml config >/tmp/peak-production-compose.yaml
          podman compose --env-file ops/production/.env.example \
            -f ops/production/compose.yaml \
            -f ops/testing/compose.phase3-acceptance.yaml \
            config >/tmp/peak-phase3-acceptance-compose.yaml
          podman compose --env-file ops/production/.env.example \
            -f ops/production/compose.yaml \
            -f ops/testing/compose.phase4-acceptance.yaml \
            config >/tmp/peak-phase4-acceptance-compose.yaml

      - name: Validate production environment contract
        run: |
          tmp="$RUNNER_TEMP/peak-production.env"
          cp ops/production/.env.example "$tmp"
          cat >>"$tmp" <<'EOF'
          PEAK_IMAGE=ghcr.io/mwombeki6/peak/peak:ci
          POSTGRES_MIGRATOR_PASSWORD=ci-migrator-password-1234
          POSTGRES_APP_PASSWORD=ci-application-password-1234
          POSTGRES_WORKER_PASSWORD=ci-worker-password-1234
          POSTGRES_PLATFORM_SUPPORT_PASSWORD=ci-platform-support-password-1234
          KEYCLOAK_ADMIN_PASSWORD=ci-keycloak-admin-password-1234
          KEYCLOAK_DB_PASSWORD=ci-keycloak-db-password-1234
          PEAK_COMMUNICATION_DELIVERY_HTTP_PROVIDER_API_KEY=ci-communication-provider-key-1234
          PEAK_ENVELOPE_KEY_BASE64=cGVhay1jaS1lbnZlbG9wZS1rZXktMzItYnl0ZXMhISE=
          PEAK_PAYMENT_GATEWAY_CREDENTIAL=ci-payment-gateway-credential-1234
          PEAK_PAYMENT_WEBHOOK_SECRET=ci-payment-webhook-secret-1234
          PEAK_CLICKPESA_API_KEY=ci-clickpesa-api-key-1234
          PEAK_CLICKPESA_CHECKSUM_KEY=ci-clickpesa-checksum-key-1234
          PEAK_FISCAL_GATEWAY_CREDENTIAL=ci-fiscal-gateway-credential-1234
          PEAK_GUEST_IDENTITY_HASH_KEY=ci-guest-identity-hmac-key-1234567890
          EOF
          sed -i 's/^          //' "$tmp"
          ops/scripts/validate-production-env.sh "$tmp"

      - name: Validate Keycloak realm JSON
        run: python3 -m json.tool ops/keycloak/peak-realm.json >/dev/null

      - name: Validate Postman collections
        run: |
          python3 -m json.tool ops/testing/Peak-Phase-2.postman_collection.json >/dev/null
          python3 -m json.tool ops/testing/Peak-Phase-3-Guest-Identity.postman_collection.json >/dev/null
          python3 -m json.tool ops/testing/Peak-Phase-3.postman_collection.json >/dev/null
          python3 -m json.tool ops/testing/Peak-Phase-4.postman_collection.json >/dev/null
          python3 -m json.tool ops/observability/phase3-dashboard.json >/dev/null
          python3 -m json.tool ops/observability/phase4-dashboard.json >/dev/null

      - name: Validate ops scripts
        run: |
          sh -n ops/scripts/*.sh
          bash -n ops/testing/run-phase2-acceptance.sh
          bash -n ops/testing/run-phase3-acceptance.sh
          bash -n ops/testing/run-phase4-acceptance.sh
          bash -n ops/testing/run-clickpesa-sandbox-acceptance.sh

      - name: Start Podman API socket for Testcontainers
        run: |
          socket="$RUNNER_TEMP/podman.sock"
          podman system service --time=0 "unix://$socket" >/tmp/podman-service.log 2>&1 &
          for attempt in $(seq 1 20); do
            [ -S "$socket" ] && break
            sleep 1
          done
          [ -S "$socket" ]
          echo "DOCKER_HOST=unix://$socket" >>"$GITHUB_ENV"
          echo "TESTCONTAINERS_RYUK_DISABLED=true" >>"$GITHUB_ENV"

      - name: Run tests
        run: ./gradlew test

      - name: Reject skipped required integration tests
        run: |
          if grep -R '<skipped' build/test-results/test/TEST-*IntegrationTests.xml; then
            echo "A required integration test was skipped" >&2
            exit 1
          fi

      - name: Validate clean migrations
        run: ./gradlew test --tests '*MigrationValidationIntegrationTests' --rerun-tasks

      - name: Check whitespace
        run: git diff --check

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
