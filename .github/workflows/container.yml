name: Container

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build OCI image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build jar
        run: ./gradlew bootJar

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/peak:${{ github.sha }}
          podman build -f Containerfile -t "$IMAGE" .
          podman save "$IMAGE" -o peak-image.tar

      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          input: peak-image.tar
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/peak:${{ github.sha }}
          podman push "$IMAGE"
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            podman tag "$IMAGE" ghcr.io/${{ github.repository }}/peak:latest
            podman push ghcr.io/${{ github.repository }}/peak:latest
          fi
          case "${{ github.ref }}" in
            refs/tags/v*)
              podman tag "$IMAGE" ghcr.io/${{ github.repository }}/peak:${{ github.ref_name }}
              podman push ghcr.io/${{ github.repository }}/peak:${{ github.ref_name }}
              ;;
          esac
