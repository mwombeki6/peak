# The Kotlin daemon's default heap is not enough to compile this source set, and
# the failure is a hard one: "Not enough memory to run compilation". It is also
# marginal rather than absolute, so it presents as flakiness — on one CI run the
# PostgreSQL 18.4 matrix passed while 16.14 failed on identical code.
#
# Sized to fit a 7 GB runner alongside Podman and a Postgres container, so it
# holds whether the repository is public (4 vCPU / 16 GB) or private (2 / 7).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
kotlin.daemon.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m
