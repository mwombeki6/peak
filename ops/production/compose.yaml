services:
  postgres:
    image: postgres:18.4@sha256:b913fd5699b8bd23fa4b06d72ecdd939fad43b80fb8651bac06caa0e6d135cac
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_MIGRATOR_USER}
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD}
    volumes:
      - peak-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_MIGRATOR_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak-db:
    image: postgres:18.4@sha256:b913fd5699b8bd23fa4b06d72ecdd939fad43b80fb8651bac06caa0e6d135cac
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - peak-keycloak-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: ${KEYCLOAK_IMAGE}
    restart: unless-stopped
    stop_grace_period: 30s
    command:
      - start
      - --import-realm
      - --hostname=${KEYCLOAK_HOSTNAME}
      - --hostname-admin=${KEYCLOAK_ADMIN_HOSTNAME}
      - --proxy-headers=xforwarded
      - --http-enabled=true
      - --http-max-queued-requests=${KEYCLOAK_HTTP_MAX_QUEUED_REQUESTS}
      - --shutdown-delay=${KEYCLOAK_SHUTDOWN_DELAY}
    environment:
      # Bootstrap administrator credentials are deliberately absent here.
      # Keycloak treats an environment variable that is present but empty as
      # set, and refuses to start when a bootstrap username has no password, so
      # a placeholder cannot express "unset". Steady state therefore omits them
      # entirely, and a first-install or recovery ceremony adds them by layering
      # compose.bootstrap-admin.yaml. The account is removed afterwards.
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_DB_POOL_INITIAL_SIZE: ${KEYCLOAK_DB_POOL_INITIAL_SIZE}
      KC_DB_POOL_MIN_SIZE: ${KEYCLOAK_DB_POOL_MIN_SIZE}
      KC_DB_POOL_MAX_SIZE: ${KEYCLOAK_DB_POOL_MAX_SIZE}
      KC_CACHE: ispn
      KC_CACHE_STACK: ${KEYCLOAK_CACHE_STACK}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
      KEYCLOAK_WEBAUTHN_RP_ID: ${KEYCLOAK_WEBAUTHN_RP_ID}
      KEYCLOAK_SMTP_FROM: ${KEYCLOAK_SMTP_FROM}
      KEYCLOAK_SMTP_FROM_DISPLAY_NAME: ${KEYCLOAK_SMTP_FROM_DISPLAY_NAME}
      KEYCLOAK_SMTP_REPLY_TO: ${KEYCLOAK_SMTP_REPLY_TO}
      KEYCLOAK_SMTP_HOST: ${KEYCLOAK_SMTP_HOST}
      KEYCLOAK_SMTP_PORT: ${KEYCLOAK_SMTP_PORT}
      KEYCLOAK_SMTP_AUTH: ${KEYCLOAK_SMTP_AUTH}
      KEYCLOAK_SMTP_STARTTLS: ${KEYCLOAK_SMTP_STARTTLS}
      KEYCLOAK_SMTP_SSL: ${KEYCLOAK_SMTP_SSL}
      KEYCLOAK_SMTP_USER: ${KEYCLOAK_SMTP_USER}
      KEYCLOAK_SMTP_PASSWORD: ${KEYCLOAK_SMTP_PASSWORD}
      PEAK_HOSPITALITY_APP_ORIGIN: ${PEAK_HOSPITALITY_APP_ORIGIN}
      PEAK_PLATFORM_APP_ORIGIN: ${PEAK_PLATFORM_APP_ORIGIN}
      PEAK_POS_REDIRECT_URI: ${PEAK_POS_REDIRECT_URI}
    volumes:
      - ../keycloak/peak-platform-realm.json:/opt/keycloak/data/import/peak-platform-realm.json:ro,Z
      - ../keycloak/peak-hospitality-realm.json:/opt/keycloak/data/import/peak-hospitality-realm.json:ro,Z
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000;
          printf "HEAD /health/ready HTTP/1.0\r\n\r\n" >&3;
          grep -q "HTTP/1.0 200" <&3'
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    ports:
      - "${KEYCLOAK_BIND_ADDRESS}:8081:8080"

  peak-migration:
    image: ${PEAK_IMAGE}
    restart: "no"
    profiles:
      - migration
    environment:
      SPRING_PROFILES_ACTIVE: prod,migration
      PEAK_RUNTIME_MODE: migration
      PEAK_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      PEAK_DATASOURCE_USERNAME: ${POSTGRES_MIGRATOR_USER}
      PEAK_DATASOURCE_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD}
      PEAK_SECURITY_JWT_ENABLED: "true"
      PEAK_SECURITY_JWT_ISSUER_URI: ${PEAK_SECURITY_JWT_ISSUER_URI}
      PEAK_SECURITY_JWT_AUDIENCE: ${PEAK_SECURITY_JWT_AUDIENCE}
      PEAK_CORS_ALLOWED_ORIGINS: ${PEAK_CORS_ALLOWED_ORIGINS}
      PEAK_REALTIME_WEBSOCKET_ALLOWED_ORIGINS: ${PEAK_REALTIME_WEBSOCKET_ALLOWED_ORIGINS}
      PEAK_ALLOW_HEADER_IDENTITY: ${PEAK_ALLOW_HEADER_IDENTITY}
      PEAK_ALLOW_TRUSTED_JWT_IDENTITY_CLAIMS: ${PEAK_ALLOW_TRUSTED_JWT_IDENTITY_CLAIMS}
      PEAK_COMMUNICATION_DELIVERY_LOCAL_PROVIDER_ENABLED: ${PEAK_COMMUNICATION_DELIVERY_LOCAL_PROVIDER_ENABLED}
      PEAK_MIGRATION_DB_POOL_MAX_SIZE: ${PEAK_MIGRATION_DB_POOL_MAX_SIZE}
      PEAK_MIGRATION_DB_POOL_MIN_IDLE: ${PEAK_MIGRATION_DB_POOL_MIN_IDLE}
      PEAK_DB_CONNECTION_TIMEOUT: ${PEAK_DB_CONNECTION_TIMEOUT}
      PEAK_DB_VALIDATION_TIMEOUT: ${PEAK_DB_VALIDATION_TIMEOUT}
      PEAK_DB_IDLE_TIMEOUT: ${PEAK_DB_IDLE_TIMEOUT}
      PEAK_DB_MAX_LIFETIME: ${PEAK_DB_MAX_LIFETIME}
    depends_on:
      postgres:
        condition: service_healthy

  peak-bootstrap:
    image: ${PEAK_IMAGE}
    restart: "no"
    profiles:
      - bootstrap
    environment:
      SPRING_PROFILES_ACTIVE: prod,bootstrap
      PEAK_RUNTIME_MODE: bootstrap
      PEAK_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      PEAK_DATASOURCE_USERNAME: ${POSTGRES_MIGRATOR_USER}
      PEAK_DATASOURCE_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD}
      PEAK_SECURITY_JWT_ENABLED: "true"
      PEAK_SECURITY_JWT_ISSUER_URI: ${PEAK_PLATFORM_JWT_ISSUER_URI}
      PEAK_SECURITY_JWT_AUDIENCE: ${PEAK_SECURITY_JWT_AUDIENCE}
      PEAK_CORS_ALLOWED_ORIGINS: ${PEAK_CORS_ALLOWED_ORIGINS}
      PEAK_ALLOW_HEADER_IDENTITY: ${PEAK_ALLOW_HEADER_IDENTITY}
      PEAK_ALLOW_TRUSTED_JWT_IDENTITY_CLAIMS: ${PEAK_ALLOW_TRUSTED_JWT_IDENTITY_CLAIMS}
      PEAK_COMMUNICATION_DELIVERY_LOCAL_PROVIDER_ENABLED: ${PEAK_COMMUNICATION_DELIVERY_LOCAL_PROVIDER_ENABLED}
      PEAK_PLATFORM_BOOTSTRAP_ENABLED: ${PEAK_PLATFORM_BOOTSTRAP_ENABLED}
      PEAK_PLATFORM_RECOVERY_ENABLED: ${PEAK_PLATFORM_RECOVERY_ENABLED:-false}
      PEAK_PLATFORM_BOOTSTRAP_FULL_NAME: ${PEAK_PLATFORM_BOOTSTRAP_FULL_NAME}
      PEAK_PLATFORM_BOOTSTRAP_EMAIL: ${PEAK_PLATFORM_BOOTSTRAP_EMAIL}
      PEAK_PLATFORM_BOOTSTRAP_ISSUER: ${PEAK_PLATFORM_BOOTSTRAP_ISSUER}
      PEAK_PLATFORM_BOOTSTRAP_SUBJECT: ${PEAK_PLATFORM_BOOTSTRAP_SUBJECT}
      # Production provisions two emergency administrator custodians in
      # one transaction, so dual control holds from the first minute.
      PEAK_PLATFORM_BOOTSTRAP_SECOND_FULL_NAME: ${PEAK_PLATFORM_BOOTSTRAP_SECOND_FULL_NAME}
      PEAK_PLATFORM_BOOTSTRAP_SECOND_EMAIL: ${PEAK_PLATFORM_BOOTSTRAP_SECOND_EMAIL}
      PEAK_PLATFORM_BOOTSTRAP_SECOND_ISSUER: ${PEAK_PLATFORM_BOOTSTRAP_SECOND_ISSUER}
      PEAK_PLATFORM_BOOTSTRAP_SECOND_SUBJECT: ${PEAK_PLATFORM_BOOTSTRAP_SECOND_SUBJECT}
      PEAK_MIGRATION_DB_POOL_MAX_SIZE: ${PEAK_MIGRATION_DB_POOL_MAX_SIZE}
      PEAK_MIGRATION_DB_POOL_MIN_IDLE: ${PEAK_MIGRATION_DB_POOL_MIN_IDLE}
    depends_on:
      postgres:
        condition: service_healthy

  peak-api:
    image: ${PEAK_IMAGE}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PEAK_RUNTIME_MODE: api
      PEAK_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      PEAK_DATASOURCE_USERNAME: ${POSTGRES_APP_USER}
      PEAK_DATASOURCE_PASSWORD: ${POSTGRES_APP_PASSWORD}
      PEAK_SECURITY_JWT_ENABLED: "true"
      PEAK_SECURITY_JWT_ISSUER_URI: ${PEAK_SECURITY_JWT_ISSUER_URI}
      PEAK_SECURITY_JWT_AUDIENCE: ${PEAK_SECURITY_JWT_AUDIENCE}
      PEAK_CORS_ALLOWED_ORIGINS: ${PEAK_CORS_ALLOWED_ORIGINS}
      PEAK_REALTIME_WEBSOCKET_ALLOWED_ORIGINS: ${PEAK_REALTIME_WEBSOCKET_ALLOWED_ORIGINS}
      PEAK_ALLOW_HEADER_IDENTITY: ${PEAK_ALLOW_HEADER_IDENTITY}
      PEAK_ALLOW_TRUSTED_JWT_IDENTITY_CLAIMS: ${PEAK_ALLOW_TRUSTED_JWT_IDENTITY_CLAIMS}
      PEAK_COMMUNICATION_DELIVERY_LOCAL_PROVIDER_ENABLED: ${PEAK_COMMUNICATION_DELIVERY_LOCAL_PROVIDER_ENABLED}
      PEAK_ENVELOPE_KEY_REFERENCE: ${PEAK_ENVELOPE_KEY_REFERENCE}
      PEAK_ENVELOPE_KEY_BASE64: ${PEAK_ENVELOPE_KEY_BASE64}
      PEAK_ENVELOPE_PREVIOUS_KEY_REFERENCE: ${PEAK_ENVELOPE_PREVIOUS_KEY_REFERENCE}
      PEAK_ENVELOPE_PREVIOUS_KEY_BASE64: ${PEAK_ENVELOPE_PREVIOUS_KEY_BASE64}
      PEAK_PAYMENT_GATEWAY_CREDENTIAL: ${PEAK_PAYMENT_GATEWAY_CREDENTIAL}
      PEAK_PAYMENT_WEBHOOK_SECRET: ${PEAK_PAYMENT_WEBHOOK_SECRET}
      PEAK_CLICKPESA_API_KEY: ${PEAK_CLICKPESA_API_KEY}
      PEAK_CLICKPESA_CHECKSUM_KEY: ${PEAK_CLICKPESA_CHECKSUM_KEY}
      PEAK_PAYMENT_PRODUCTION_APPROVED_PROVIDER_CODES: ${PEAK_PAYMENT_PRODUCTION_APPROVED_PROVIDER_CODES}
      PEAK_FISCAL_PRODUCTION_APPROVED_PROVIDER_CODES: ${PEAK_FISCAL_PRODUCTION_APPROVED_PROVIDER_CODES}
      PEAK_FISCAL_GATEWAY_CREDENTIAL: ${PEAK_FISCAL_GATEWAY_CREDENTIAL}
      PEAK_OUTBOUND_PROVIDER_ALLOWED_HOSTS: ${PEAK_OUTBOUND_PROVIDER_ALLOWED_HOSTS}
      PEAK_OUTBOX_WORKER_HEALTH_REQUIRED: "true"
      MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db,keycloakDiscovery,workerRuntime,realtimeJournal,clickPesa
      PEAK_DB_POOL_MAX_SIZE: ${PEAK_DB_POOL_MAX_SIZE}
      PEAK_DB_POOL_MIN_IDLE: ${PEAK_DB_POOL_MIN_IDLE}
      PEAK_DB_CONNECTION_TIMEOUT: ${PEAK_DB_CONNECTION_TIMEOUT}
      PEAK_DB_VALIDATION_TIMEOUT: ${PEAK_DB_VALIDATION_TIMEOUT}
      PEAK_DB_IDLE_TIMEOUT: ${PEAK_DB_IDLE_TIMEOUT}
      PEAK_DB_MAX_LIFETIME: ${PEAK_DB_MAX_LIFETIME}
      PEAK_GUEST_IDENTITY_HASH_KEY: ${PEAK_GUEST_IDENTITY_HASH_KEY}
      PEAK_GUEST_IDENTITY_HASH_KEY_VERSION: ${PEAK_GUEST_IDENTITY_HASH_KEY_VERSION}
      PEAK_GUEST_IDENTITY_PREVIOUS_HASH_KEY: ${PEAK_GUEST_IDENTITY_PREVIOUS_HASH_KEY}
      PEAK_GUEST_IDENTITY_PREVIOUS_HASH_KEY_VERSION: ${PEAK_GUEST_IDENTITY_PREVIOUS_HASH_KEY_VERSION}
      PEAK_NIDA_MODE: ${PEAK_NIDA_MODE}
      PEAK_NIDA_BASE_URL: ${PEAK_NIDA_BASE_URL}
      PEAK_NIDA_CLIENT_ID: ${PEAK_NIDA_CLIENT_ID}
      PEAK_NIDA_CLIENT_SECRET: ${PEAK_NIDA_CLIENT_SECRET}
      PEAK_NIDA_CONNECT_TIMEOUT: ${PEAK_NIDA_CONNECT_TIMEOUT}
      PEAK_NIDA_READ_TIMEOUT: ${PEAK_NIDA_READ_TIMEOUT}
      PEAK_OTLP_METRICS_EXPORT_ENABLED: ${PEAK_OTLP_METRICS_EXPORT_ENABLED}
      PEAK_OTLP_LOGGING_EXPORT_ENABLED: ${PEAK_OTLP_LOGGING_EXPORT_ENABLED}
      PEAK_OTLP_TRACING_EXPORT_ENABLED: ${PEAK_OTLP_TRACING_EXPORT_ENABLED}
      PEAK_REPORT_STORAGE_ENABLED: ${PEAK_REPORT_STORAGE_ENABLED}
      PEAK_REPORT_STORAGE_ENDPOINT: ${PEAK_REPORT_STORAGE_ENDPOINT}
      PEAK_REPORT_STORAGE_ACCESS_KEY: ${PEAK_REPORT_STORAGE_ACCESS_KEY}
      PEAK_REPORT_STORAGE_SECRET_KEY: ${PEAK_REPORT_STORAGE_SECRET_KEY}
      PEAK_REPORT_STORAGE_BUCKET: ${PEAK_REPORT_STORAGE_BUCKET}
      PEAK_REPORT_STORAGE_REGION: ${PEAK_REPORT_STORAGE_REGION}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "${PEAK_API_BIND_ADDRESS}:8080:8080"

  peak-platform:
    image: ${PEAK_IMAGE}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod,platform
      PEAK_RUNTIME_MODE: platform
      PEAK_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      PEAK_DATASOURCE_USERNAME: ${POSTGRES_PLATFORM_USER}
      PEAK_DATASOURCE_PASSWORD: ${POSTGRES_PLATFORM_PASSWORD}
      PEAK_SECURITY_JWT_ENABLED: "true"
      PEAK_SECURITY_JWT_ISSUER_URI: ${PEAK_PLATFORM_JWT_ISSUER_URI}
      PEAK_SECURITY_JWT_AUDIENCE: ${PEAK_SECURITY_JWT_AUDIENCE}
      PEAK_CORS_ALLOWED_ORIGINS: ${PEAK_PLATFORM_CORS_ALLOWED_ORIGINS}
      PEAK_REALTIME_WEBSOCKET_ALLOWED_ORIGINS: ${PEAK_PLATFORM_REALTIME_WEBSOCKET_ALLOWED_ORIGINS}
      PEAK_ALLOW_HEADER_IDENTITY: "false"
      PEAK_ALLOW_TRUSTED_JWT_IDENTITY_CLAIMS: "false"
      PEAK_COMMUNICATION_DELIVERY_LOCAL_PROVIDER_ENABLED: "false"
      PEAK_ENVELOPE_KEY_REFERENCE: ${PEAK_ENVELOPE_KEY_REFERENCE}
      PEAK_ENVELOPE_KEY_BASE64: ${PEAK_ENVELOPE_KEY_BASE64}
      PEAK_ENVELOPE_PREVIOUS_KEY_REFERENCE: ${PEAK_ENVELOPE_PREVIOUS_KEY_REFERENCE}
      PEAK_ENVELOPE_PREVIOUS_KEY_BASE64: ${PEAK_ENVELOPE_PREVIOUS_KEY_BASE64}
      PEAK_OUTBOX_WORKER_ENABLED: "false"
      PEAK_OUTBOX_WORKER_HEALTH_REQUIRED: "true"
      PEAK_DB_POOL_MAX_SIZE: ${PEAK_DB_POOL_MAX_SIZE}
      PEAK_DB_POOL_MIN_IDLE: ${PEAK_DB_POOL_MIN_IDLE}
      PEAK_DB_CONNECTION_TIMEOUT: ${PEAK_DB_CONNECTION_TIMEOUT}
      PEAK_DB_VALIDATION_TIMEOUT: ${PEAK_DB_VALIDATION_TIMEOUT}
      PEAK_DB_IDLE_TIMEOUT: ${PEAK_DB_IDLE_TIMEOUT}
      PEAK_DB_MAX_LIFETIME: ${PEAK_DB_MAX_LIFETIME}
      PEAK_REPORT_STORAGE_ENABLED: ${PEAK_REPORT_STORAGE_ENABLED}
      PEAK_REPORT_STORAGE_ENDPOINT: ${PEAK_REPORT_STORAGE_ENDPOINT}
      PEAK_REPORT_STORAGE_ACCESS_KEY: ${PEAK_REPORT_STORAGE_ACCESS_KEY}
      PEAK_REPORT_STORAGE_SECRET_KEY: ${PEAK_REPORT_STORAGE_SECRET_KEY}
      PEAK_REPORT_STORAGE_BUCKET: ${PEAK_REPORT_STORAGE_BUCKET}
      PEAK_REPORT_STORAGE_REGION: ${PEAK_REPORT_STORAGE_REGION}
      PEAK_OTLP_METRICS_EXPORT_ENABLED: ${PEAK_OTLP_METRICS_EXPORT_ENABLED}
      PEAK_OTLP_LOGGING_EXPORT_ENABLED: ${PEAK_OTLP_LOGGING_EXPORT_ENABLED}
      PEAK_OTLP_TRACING_EXPORT_ENABLED: ${PEAK_OTLP_TRACING_EXPORT_ENABLED}
      MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db,keycloakDiscovery,workerRuntime
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "${PEAK_PLATFORM_BIND_ADDRESS}:8082:8080"

  peak-worker:
    image: ${PEAK_IMAGE}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod,worker
      PEAK_RUNTIME_MODE: worker
      PEAK_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      PEAK_DATASOURCE_USERNAME: ${POSTGRES_WORKER_USER}
      PEAK_DATASOURCE_PASSWORD: ${POSTGRES_WORKER_PASSWORD}
      PEAK_SECURITY_JWT_ENABLED: "true"
      PEAK_SECURITY_JWT_ISSUER_URI: ${PEAK_SECURITY_JWT_ISSUER_URI}
      PEAK_SECURITY_JWT_AUDIENCE: ${PEAK_SECURITY_JWT_AUDIENCE}
      PEAK_CORS_ALLOWED_ORIGINS: ${PEAK_CORS_ALLOWED_ORIGINS}
      PEAK_REALTIME_WEBSOCKET_ALLOWED_ORIGINS: ${PEAK_REALTIME_WEBSOCKET_ALLOWED_ORIGINS}
      PEAK_OUTBOX_WORKER_ENABLED: "true"
      PEAK_OUTBOX_WORKER_BATCH_SIZE: ${PEAK_OUTBOX_WORKER_BATCH_SIZE}
      PEAK_OUTBOX_WORKER_MAX_PARALLELISM: ${PEAK_OUTBOX_WORKER_MAX_PARALLELISM}
      PEAK_ALLOW_HEADER_IDENTITY: ${PEAK_ALLOW_HEADER_IDENTITY}
      PEAK_ALLOW_TRUSTED_JWT_IDENTITY_CLAIMS: ${PEAK_ALLOW_TRUSTED_JWT_IDENTITY_CLAIMS}
      PEAK_COMMUNICATION_DELIVERY_LOCAL_PROVIDER_ENABLED: ${PEAK_COMMUNICATION_DELIVERY_LOCAL_PROVIDER_ENABLED}
      PEAK_COMMUNICATION_DELIVERY_HTTP_PROVIDER_ENABLED: ${PEAK_COMMUNICATION_DELIVERY_HTTP_PROVIDER_ENABLED}
      PEAK_COMMUNICATION_DELIVERY_HTTP_PROVIDER_BASE_URL: ${PEAK_COMMUNICATION_DELIVERY_HTTP_PROVIDER_BASE_URL}
      PEAK_COMMUNICATION_DELIVERY_HTTP_PROVIDER_API_KEY: ${PEAK_COMMUNICATION_DELIVERY_HTTP_PROVIDER_API_KEY}
      PEAK_INVITATION_ACCEPTANCE_BASE_URL: ${PEAK_INVITATION_ACCEPTANCE_BASE_URL}
      PEAK_ENVELOPE_KEY_REFERENCE: ${PEAK_ENVELOPE_KEY_REFERENCE}
      PEAK_ENVELOPE_KEY_BASE64: ${PEAK_ENVELOPE_KEY_BASE64}
      PEAK_ENVELOPE_PREVIOUS_KEY_REFERENCE: ${PEAK_ENVELOPE_PREVIOUS_KEY_REFERENCE}
      PEAK_ENVELOPE_PREVIOUS_KEY_BASE64: ${PEAK_ENVELOPE_PREVIOUS_KEY_BASE64}
      PEAK_PAYMENT_GATEWAY_CREDENTIAL: ${PEAK_PAYMENT_GATEWAY_CREDENTIAL}
      PEAK_CLICKPESA_API_KEY: ${PEAK_CLICKPESA_API_KEY}
      PEAK_CLICKPESA_CHECKSUM_KEY: ${PEAK_CLICKPESA_CHECKSUM_KEY}
      PEAK_PAYMENT_PRODUCTION_APPROVED_PROVIDER_CODES: ${PEAK_PAYMENT_PRODUCTION_APPROVED_PROVIDER_CODES}
      PEAK_FISCAL_PRODUCTION_APPROVED_PROVIDER_CODES: ${PEAK_FISCAL_PRODUCTION_APPROVED_PROVIDER_CODES}
      PEAK_FISCAL_GATEWAY_CREDENTIAL: ${PEAK_FISCAL_GATEWAY_CREDENTIAL}
      PEAK_OUTBOUND_PROVIDER_ALLOWED_HOSTS: ${PEAK_OUTBOUND_PROVIDER_ALLOWED_HOSTS}
      PEAK_WORKER_DB_POOL_MAX_SIZE: ${PEAK_WORKER_DB_POOL_MAX_SIZE}
      PEAK_WORKER_DB_POOL_MIN_IDLE: ${PEAK_WORKER_DB_POOL_MIN_IDLE}
      PEAK_DB_CONNECTION_TIMEOUT: ${PEAK_DB_CONNECTION_TIMEOUT}
      PEAK_DB_VALIDATION_TIMEOUT: ${PEAK_DB_VALIDATION_TIMEOUT}
      PEAK_DB_IDLE_TIMEOUT: ${PEAK_DB_IDLE_TIMEOUT}
      PEAK_DB_MAX_LIFETIME: ${PEAK_DB_MAX_LIFETIME}
      PEAK_OTLP_METRICS_EXPORT_ENABLED: ${PEAK_OTLP_METRICS_EXPORT_ENABLED}
      PEAK_OTLP_LOGGING_EXPORT_ENABLED: ${PEAK_OTLP_LOGGING_EXPORT_ENABLED}
      PEAK_OTLP_TRACING_EXPORT_ENABLED: ${PEAK_OTLP_TRACING_EXPORT_ENABLED}
      PEAK_REPORT_STORAGE_ENABLED: ${PEAK_REPORT_STORAGE_ENABLED}
      PEAK_REPORT_STORAGE_ENDPOINT: ${PEAK_REPORT_STORAGE_ENDPOINT}
      PEAK_REPORT_STORAGE_ACCESS_KEY: ${PEAK_REPORT_STORAGE_ACCESS_KEY}
      PEAK_REPORT_STORAGE_SECRET_KEY: ${PEAK_REPORT_STORAGE_SECRET_KEY}
      PEAK_REPORT_STORAGE_BUCKET: ${PEAK_REPORT_STORAGE_BUCKET}
      PEAK_REPORT_STORAGE_REGION: ${PEAK_REPORT_STORAGE_REGION}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  peak-postgres-data:
  peak-keycloak-db-data:
