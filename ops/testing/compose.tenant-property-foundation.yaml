# Bootstrap, API, worker, and identity topology for tenant/property setup.
services:
  peak-api:
    environment:
      SPRING_PROFILES_ACTIVE: acceptance
      PEAK_REPORT_STORAGE_ENABLED: "false"

  peak-platform:
    environment:
      SPRING_PROFILES_ACTIVE: acceptance,platform
      PEAK_RUNTIME_MODE: platform
      PEAK_REPORT_STORAGE_ENABLED: "false"

  peak-worker:
    environment:
      SPRING_PROFILES_ACTIVE: acceptance,worker
      PEAK_REPORT_STORAGE_ENABLED: "false"
