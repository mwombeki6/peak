# API and worker overrides for the stay/finance acceptance foundation.
services:
  # Acceptance builds a brand-new Keycloak on every run, which is precisely the
  # first-install case where a temporary bootstrap administrator is legitimate.
  # Production compose omits these entirely; supplying them here keeps the test
  # topology working without weakening the deployed posture, and exercises the
  # same ceremony path operators use once.
  keycloak:
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

  peak-api:
    environment:
      SPRING_PROFILES_ACTIVE: acceptance
      PEAK_RUNTIME_MODE: api
      PEAK_OUTBOX_WORKER_HEALTH_REQUIRED: "true"
      PEAK_REPORT_STORAGE_ENABLED: "false"
      MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db,keycloakDiscovery,workerRuntime,realtimeJournal,clickPesa

  peak-worker:
    environment:
      SPRING_PROFILES_ACTIVE: acceptance,worker
      PEAK_RUNTIME_MODE: worker
      PEAK_OUTBOX_WORKER_ENABLED: "true"
      PEAK_REPORT_STORAGE_ENABLED: "false"
