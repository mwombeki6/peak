spring:
  docker:
    compose:
      enabled: ${PEAK_DOCKER_COMPOSE_ENABLED:false}

peak:
  realtime:
    websocket:
      allowed-origins:
        - http://localhost:3000
        - http://localhost:5173
  security:
    http:
      cors:
        allowed-origins:
          - http://localhost:3000
          - http://localhost:5173
    request-context:
      allow-header-identity: ${PEAK_ALLOW_HEADER_IDENTITY:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
