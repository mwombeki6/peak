spring:
  main:
    web-application-type: none
  datasource:
    hikari:
      maximum-pool-size: ${PEAK_MIGRATION_DB_POOL_MAX_SIZE:2}
      minimum-idle: ${PEAK_MIGRATION_DB_POOL_MIN_IDLE:0}
  flyway:
    enabled: true

peak:
  runtime:
    mode: migration
  reliability:
    outbox:
      worker:
        enabled: false
