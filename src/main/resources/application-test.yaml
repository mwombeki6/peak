peak:
  observability:
    operational-metrics:
      enabled: false
  usermanagement:
    invitation:
      expose-token-in-response: true
  realtime:
    websocket:
      allowed-origins:
        - http://localhost
    journal:
      fanout-enabled: false
  security:
    http:
      jwt:
        enabled: false
      cors:
        allowed-origins:
          - http://localhost
    request-context:
      allow-header-identity: true
  reliability:
    outbox:
      worker:
        enabled: false

management:
  defaults:
    metrics:
      export:
        enabled: false
