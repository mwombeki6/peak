peak:
  observability:
    operational-metrics:
      enabled: false
  usermanagement:
    invitation:
      expose-token-in-response: true
    activation:
      expose-code-in-response: true
  realtime:
    websocket:
      allowed-origins:
        - http://localhost
    journal:
      fanout-enabled: false
  security:
    http:
      jwt:
        enabled: false
      cors:
        allowed-origins:
          - http://localhost
    request-context:
      allow-header-identity: true
    step-up:
      # Tests cannot mint a real MFA ceremony, so enforcement is relaxed here. Stated by name
      # rather than inherited from allow-header-identity, so an integration test can turn it
      # back on and prove a step-up gate is actually wired into the service that needs it.
      assume-unavailable: true
  reliability:
    outbox:
      worker:
        enabled: false

management:
  defaults:
    metrics:
      export:
        enabled: false
