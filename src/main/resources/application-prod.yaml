spring:
  docker:
    compose:
      enabled: false
  flyway:
    enabled: false
  datasource:
    hikari:
      maximum-pool-size: ${PEAK_DB_POOL_MAX_SIZE:20}
      minimum-idle: ${PEAK_DB_POOL_MIN_IDLE:5}
      connection-timeout: ${PEAK_DB_CONNECTION_TIMEOUT:5000}
      validation-timeout: ${PEAK_DB_VALIDATION_TIMEOUT:2000}
      idle-timeout: ${PEAK_DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${PEAK_DB_MAX_LIFETIME:1800000}
  devtools:
    add-properties: false

peak:
  realtime:
    websocket:
      allowed-origins: ${PEAK_REALTIME_WEBSOCKET_ALLOWED_ORIGINS}
  security:
    http:
      jwt:
        enabled: true
      cors:
        allowed-origins: ${PEAK_CORS_ALLOWED_ORIGINS}
    request-context:
      allow-header-identity: false
      allow-trusted-jwt-identity-claims: false
  integrations:
    payment:
      providers:
        vodacom-mpesa:
          base-url: ${PEAK_PAYMENT_VODACOM_MPESA_URL:}
          api-key: ${PEAK_PAYMENT_VODACOM_MPESA_API_KEY:}
          api-secret: ${PEAK_PAYMENT_VODACOM_MPESA_API_SECRET:}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
