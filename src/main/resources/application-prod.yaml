spring:
  docker:
    compose:
      enabled: false
  flyway:
    enabled: false
  devtools:
    add-properties: false

peak:
  security:
    http:
      jwt:
        enabled: true
      cors:
        allowed-origins: ${PEAK_CORS_ALLOWED_ORIGINS}
    request-context:
      allow-header-identity: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
