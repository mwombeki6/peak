spring:
  docker:
    compose:
      enabled: false
  flyway:
    enabled: false
  datasource:
    hikari:
      maximum-pool-size: ${PEAK_DB_POOL_MAX_SIZE:20}
      minimum-idle: ${PEAK_DB_POOL_MIN_IDLE:5}
      connection-timeout: ${PEAK_DB_CONNECTION_TIMEOUT:5000}
      validation-timeout: ${PEAK_DB_VALIDATION_TIMEOUT:2000}
      idle-timeout: ${PEAK_DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${PEAK_DB_MAX_LIFETIME:1800000}
  devtools:
    add-properties: false

peak:
  communication:
    invitation:
      acceptance-base-url: ${PEAK_INVITATION_ACCEPTANCE_BASE_URL:}
  payment:
    production-approved-provider-codes: ${PEAK_PAYMENT_PRODUCTION_APPROVED_PROVIDER_CODES:}
    providers:
      contract-mock:
        enabled: false
  platformbilling:
    enabled: ${PEAK_PLATFORMBILLING_ENABLED:true}
    primary-provider: ${PEAK_PLATFORMBILLING_PRIMARY_PROVIDER:snippe}
    fallback-provider: ${PEAK_PLATFORMBILLING_FALLBACK_PROVIDER:}
    app-name: ${PEAK_PLATFORMBILLING_APP_NAME:}
    client-id-secret-ref: ${PEAK_PLATFORMBILLING_CLIENT_ID_SECRET_REF:}
    api-key-secret-ref: ${PEAK_PLATFORMBILLING_API_KEY_SECRET_REF:}
    checksum-key-secret-ref: ${PEAK_PLATFORMBILLING_CHECKSUM_KEY_SECRET_REF:}
    endpoint-url: ${PEAK_PLATFORMBILLING_ENDPOINT_URL:}
  fiscal:
    production-approved-provider-codes: ${PEAK_FISCAL_PRODUCTION_APPROVED_PROVIDER_CODES:}
    providers:
      contract-mock:
        enabled: false
      signed-simulator:
        enabled: false
  guest-identity:
    hash-key: ${PEAK_GUEST_IDENTITY_HASH_KEY:}
    hash-key-version: ${PEAK_GUEST_IDENTITY_HASH_KEY_VERSION:v1}
    previous-hash-key: ${PEAK_GUEST_IDENTITY_PREVIOUS_HASH_KEY:}
    previous-hash-key-version: ${PEAK_GUEST_IDENTITY_PREVIOUS_HASH_KEY_VERSION:}
  realtime:
    websocket:
      allowed-origins: ${PEAK_REALTIME_WEBSOCKET_ALLOWED_ORIGINS}
  security:
    envelope:
      key-reference: ${PEAK_ENVELOPE_KEY_REFERENCE:}
      previous-key-reference: ${PEAK_ENVELOPE_PREVIOUS_KEY_REFERENCE:}
    outbound:
      allowed-provider-hosts: ${PEAK_OUTBOUND_PROVIDER_ALLOWED_HOSTS:}
    http:
      jwt:
        enabled: true
      cors:
        allowed-origins: ${PEAK_CORS_ALLOWED_ORIGINS}
    request-context:
      allow-header-identity: false
      allow-trusted-jwt-identity-claims: false
    route-guard:
      validate-route-matrix-on-startup: true
    runtime-route-boundary:
      enabled: true
  integrations:
    nida:
      mode: ${PEAK_NIDA_MODE:disabled}
      base-url: ${PEAK_NIDA_BASE_URL:}
      client-id: ${PEAK_NIDA_CLIENT_ID:}
      client-secret: ${PEAK_NIDA_CLIENT_SECRET:}
      connect-timeout: ${PEAK_NIDA_CONNECT_TIMEOUT:3s}
      read-timeout: ${PEAK_NIDA_READ_TIMEOUT:8s}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  forward-headers-strategy: native

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
