spring:
  application:
    name: peak
  docker:
    compose:
      enabled: ${PEAK_DOCKER_COMPOSE_ENABLED:false}
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${PEAK_DATASOURCE_URL:jdbc:postgresql://localhost:5432/peak}
    username: ${PEAK_DATASOURCE_USERNAME:peak_migrator}
    password: ${PEAK_DATASOURCE_PASSWORD:peak_migrator}
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  jooq:
    sql-dialect: postgres

peak:
  runtime:
    mode: ${PEAK_RUNTIME_MODE:api}
  observability:
    operational-metrics:
      enabled: ${PEAK_OPERATIONAL_METRICS_ENABLED:true}
      refresh-interval-ms: ${PEAK_OPERATIONAL_METRICS_REFRESH_INTERVAL_MS:30000}
  guest-identity:
    hash-key: ${PEAK_GUEST_IDENTITY_HASH_KEY:local-development-identity-hmac-key}
    hash-key-version: ${PEAK_GUEST_IDENTITY_HASH_KEY_VERSION:v1}
    previous-hash-key: ${PEAK_GUEST_IDENTITY_PREVIOUS_HASH_KEY:}
    previous-hash-key-version: ${PEAK_GUEST_IDENTITY_PREVIOUS_HASH_KEY_VERSION:}
  integrations:
    nida:
      mode: ${PEAK_NIDA_MODE:disabled}
      base-url: ${PEAK_NIDA_BASE_URL:}
      client-id: ${PEAK_NIDA_CLIENT_ID:}
      client-secret: ${PEAK_NIDA_CLIENT_SECRET:}
      connect-timeout: ${PEAK_NIDA_CONNECT_TIMEOUT:3s}
      read-timeout: ${PEAK_NIDA_READ_TIMEOUT:8s}
  realtime:
    fanout:
      parallelism: ${PEAK_REALTIME_FANOUT_PARALLELISM:4}
      queue-capacity-per-shard: ${PEAK_REALTIME_FANOUT_QUEUE_CAPACITY_PER_SHARD:500}
    websocket:
      allowed-origins: ${PEAK_REALTIME_WEBSOCKET_ALLOWED_ORIGINS:}
      max-connections: ${PEAK_REALTIME_WEBSOCKET_MAX_CONNECTIONS:500}
    sse:
      max-connections-per-property: ${PEAK_REALTIME_SSE_MAX_CONNECTIONS_PER_PROPERTY:100}
      timeout: ${PEAK_REALTIME_SSE_TIMEOUT:30m}
      heartbeat-interval-ms: ${PEAK_REALTIME_SSE_HEARTBEAT_INTERVAL_MS:15000}
    journal:
      fanout-enabled: ${PEAK_REALTIME_JOURNAL_FANOUT_ENABLED:true}
      poll-batch-size: ${PEAK_REALTIME_JOURNAL_POLL_BATCH_SIZE:500}
      replay-limit: ${PEAK_REALTIME_JOURNAL_REPLAY_LIMIT:500}
      poll-interval-ms: ${PEAK_REALTIME_JOURNAL_POLL_INTERVAL_MS:250}
      cleanup-interval-ms: ${PEAK_REALTIME_JOURNAL_CLEANUP_INTERVAL_MS:60000}
  payment:
    providers:
      snippe:
        base-url: ${PEAK_SNIPPE_BASE_URL:https://api.snippe.sh}
        webhook-tolerance: ${PEAK_SNIPPE_WEBHOOK_TOLERANCE:5m}
      clickpesa:
        connect-timeout: ${PEAK_CLICKPESA_CONNECT_TIMEOUT:3s}
        request-timeout: ${PEAK_CLICKPESA_REQUEST_TIMEOUT:15s}
        token-ttl: ${PEAK_CLICKPESA_TOKEN_TTL:1h}
        token-refresh-skew: ${PEAK_CLICKPESA_TOKEN_REFRESH_SKEW:5m}
      http-gateway:
        connect-timeout: ${PEAK_PAYMENT_HTTP_CONNECT_TIMEOUT:3s}
        request-timeout: ${PEAK_PAYMENT_HTTP_REQUEST_TIMEOUT:15s}
  # Peak SaaS collection into Peak's own merchant. Not hotel guest rails
  # (`payment_provider_accounts`). Webhook: POST /api/v1/platform-billing/webhooks/snippe
  platformbilling:
    enabled: ${PEAK_PLATFORMBILLING_ENABLED:true}
    primary-provider: ${PEAK_PLATFORMBILLING_PRIMARY_PROVIDER:snippe}
    fallback-provider: ${PEAK_PLATFORMBILLING_FALLBACK_PROVIDER:}
    app-name: ${PEAK_PLATFORMBILLING_APP_NAME:}
    client-id-secret-ref: ${PEAK_PLATFORMBILLING_CLIENT_ID_SECRET_REF:}
    api-key-secret-ref: ${PEAK_PLATFORMBILLING_API_KEY_SECRET_REF:}
    checksum-key-secret-ref: ${PEAK_PLATFORMBILLING_CHECKSUM_KEY_SECRET_REF:}
    endpoint-url: ${PEAK_PLATFORMBILLING_ENDPOINT_URL:}
  fiscal:
    providers:
      http-gateway:
        connect-timeout: ${PEAK_FISCAL_HTTP_CONNECT_TIMEOUT:3s}
        request-timeout: ${PEAK_FISCAL_HTTP_REQUEST_TIMEOUT:20s}
  reporting:
    storage:
      enabled: ${PEAK_REPORT_STORAGE_ENABLED:false}
      endpoint: ${PEAK_REPORT_STORAGE_ENDPOINT:http://localhost:9000}
      access-key: ${PEAK_REPORT_STORAGE_ACCESS_KEY:peak}
      secret-key: ${PEAK_REPORT_STORAGE_SECRET_KEY:peak-development-secret}
      bucket: ${PEAK_REPORT_STORAGE_BUCKET:peak-private-reports}
      region: ${PEAK_REPORT_STORAGE_REGION:us-east-1}
    retention:
      cleanup-interval-ms: ${PEAK_REPORT_RETENTION_CLEANUP_INTERVAL_MS:3600000}
  reliability:
    outbox:
      worker:
        enabled: ${PEAK_OUTBOX_WORKER_ENABLED:false}
        worker-id: ${PEAK_OUTBOX_WORKER_ID:}
        batch-size: ${PEAK_OUTBOX_WORKER_BATCH_SIZE:50}
        max-parallelism: ${PEAK_OUTBOX_WORKER_MAX_PARALLELISM:4}
        poll-interval: ${PEAK_OUTBOX_WORKER_POLL_INTERVAL:2s}
        idle-poll-interval: ${PEAK_OUTBOX_WORKER_IDLE_POLL_INTERVAL:10s}
        delivery-timeout: ${PEAK_OUTBOX_WORKER_DELIVERY_TIMEOUT:30s}
        retry-initial-delay: ${PEAK_OUTBOX_WORKER_RETRY_INITIAL_DELAY:30s}
        retry-max-delay: ${PEAK_OUTBOX_WORKER_RETRY_MAX_DELAY:15m}
        reclaim-stale-locks: ${PEAK_OUTBOX_WORKER_RECLAIM_STALE_LOCKS:true}
        stale-lock-timeout: ${PEAK_OUTBOX_WORKER_STALE_LOCK_TIMEOUT:15m}
        stale-reclaim-interval: ${PEAK_OUTBOX_WORKER_STALE_RECLAIM_INTERVAL:1m}
        stale-reclaim-limit: ${PEAK_OUTBOX_WORKER_STALE_RECLAIM_LIMIT:500}
        heartbeat-interval: ${PEAK_OUTBOX_WORKER_HEARTBEAT_INTERVAL:15s}
        heartbeat-stale-after: ${PEAK_OUTBOX_WORKER_HEARTBEAT_STALE_AFTER:45s}
        health-required: ${PEAK_OUTBOX_WORKER_HEALTH_REQUIRED:false}
  security:
    envelope:
      key-reference: ${PEAK_ENVELOPE_KEY_REFERENCE:literal:cGVhay1sb2NhbC1lbnZlbG9wZS1rZXktMzItYnl0ZSE=}
      previous-key-reference: ${PEAK_ENVELOPE_PREVIOUS_KEY_REFERENCE:}
    http:
      jwt:
        enabled: ${PEAK_SECURITY_JWT_ENABLED:false}
        issuer-uri: ${PEAK_SECURITY_JWT_ISSUER_URI:}
        audience: ${PEAK_SECURITY_JWT_AUDIENCE:}
        discovery-health-timeout: ${PEAK_SECURITY_JWT_DISCOVERY_HEALTH_TIMEOUT:3s}
        discovery-health-cache-ttl: ${PEAK_SECURITY_JWT_DISCOVERY_HEALTH_CACHE_TTL:30s}
      cors:
        allowed-origins: ${PEAK_CORS_ALLOWED_ORIGINS:}
        allowed-headers:
          - Authorization
          - Content-Type
          - Idempotency-Key
          - X-Correlation-Id
          - X-Peak-Support-Session-Id
          - X-Peak-Support-Tenant-Id
        exposed-headers:
          - X-Correlation-Id
    request-context:
      allow-header-identity: ${PEAK_ALLOW_HEADER_IDENTITY:false}
      allow-trusted-jwt-identity-claims: ${PEAK_ALLOW_TRUSTED_JWT_IDENTITY_CLAIMS:false}
    route-guard:
      enabled: ${PEAK_ROUTE_GUARD_ENABLED:true}
      deny-unregistered-api-routes: ${PEAK_ROUTE_GUARD_DENY_UNREGISTERED:true}
      rule-cache-ttl: ${PEAK_ROUTE_GUARD_RULE_CACHE_TTL:30s}
  communication:
    invitation:
      acceptance-base-url: ${PEAK_INVITATION_ACCEPTANCE_BASE_URL:http://localhost:3000/invitations/accept}
    # Which adapter carries each channel. Capability is not routing: the HTTP gateway
    # supports four channels and must still be told which it is responsible for.
    #
    # These name the local provider because that is what is registered by default
    # (matchIfMissing), so development behaves as it always did. Production routes
    # SMS to Beem and email to the HTTP gateway, and refuses to start if it names
    # an adapter that is not enabled — which is the intended way to find out.
    #
    # whatsapp stays blank until a Beem from-number exists. Routing it without
    # that number fails worker startup. voice_phone is the same shape.
    routing:
      email: ${PEAK_COMMUNICATION_ROUTING_EMAIL:local}
      sms: ${PEAK_COMMUNICATION_ROUTING_SMS:local}
      whatsapp: ${PEAK_COMMUNICATION_ROUTING_WHATSAPP:}
      voice-phone: ${PEAK_COMMUNICATION_ROUTING_VOICE_PHONE:}
    providers:
      beem:
        enabled: ${PEAK_COMMUNICATION_PROVIDERS_BEEM_ENABLED:false}
        sms-base-url: ${PEAK_COMMUNICATION_PROVIDERS_BEEM_SMS_BASE_URL:https://apisms.beem.africa}
        whatsapp-base-url: ${PEAK_COMMUNICATION_PROVIDERS_BEEM_WHATSAPP_BASE_URL:https://apichatcore.beem.africa}
        api-key: ${PEAK_COMMUNICATION_PROVIDERS_BEEM_API_KEY:}
        secret-key: ${PEAK_COMMUNICATION_PROVIDERS_BEEM_SECRET_KEY:}
        source-addr: ${PEAK_COMMUNICATION_PROVIDERS_BEEM_SOURCE_ADDR:}
        whatsapp-from: ${PEAK_COMMUNICATION_PROVIDERS_BEEM_WHATSAPP_FROM:}
        whatsapp-callback-url: ${PEAK_COMMUNICATION_PROVIDERS_BEEM_WHATSAPP_CALLBACK_URL:}
  usermanagement:
    invitation:
      expose-token-in-response: ${PEAK_INVITATION_EXPOSE_TOKEN_IN_RESPONSE:false}
management:
  otlp:
    metrics:
      export:
        enabled: ${PEAK_OTLP_METRICS_EXPORT_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: ${PEAK_OTLP_LOGGING_EXPORT_ENABLED:false}
  tracing:
    export:
      otlp:
        enabled: ${PEAK_OTLP_TRACING_EXPORT_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    enabled: ${PEAK_SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${PEAK_SWAGGER_UI_ENABLED:true}
