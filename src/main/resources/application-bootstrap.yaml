spring:
  main:
    web-application-type: none
  flyway:
    enabled: false
  datasource:
    hikari:
      maximum-pool-size: ${PEAK_MIGRATION_DB_POOL_MAX_SIZE:2}
      minimum-idle: ${PEAK_MIGRATION_DB_POOL_MIN_IDLE:0}

peak:
  runtime:
    mode: bootstrap
  reliability:
    outbox:
      worker:
        enabled: false
  bootstrap:
    platform:
      enabled: ${PEAK_PLATFORM_BOOTSTRAP_ENABLED:false}
      recovery-enabled: ${PEAK_PLATFORM_RECOVERY_ENABLED:false}
      full-name: ${PEAK_PLATFORM_BOOTSTRAP_FULL_NAME:}
      email: ${PEAK_PLATFORM_BOOTSTRAP_EMAIL:}
      issuer: ${PEAK_PLATFORM_BOOTSTRAP_ISSUER:}
      subject: ${PEAK_PLATFORM_BOOTSTRAP_SUBJECT:}
      # Second emergency administrator custodian. These need explicit mappings
      # because the environment variable order, PEAK_PLATFORM_BOOTSTRAP_*, does
      # not match the property path, peak.bootstrap.platform.*, so relaxed
      # binding cannot connect them on its own.
      second-full-name: ${PEAK_PLATFORM_BOOTSTRAP_SECOND_FULL_NAME:}
      second-email: ${PEAK_PLATFORM_BOOTSTRAP_SECOND_EMAIL:}
      second-issuer: ${PEAK_PLATFORM_BOOTSTRAP_SECOND_ISSUER:}
      second-subject: ${PEAK_PLATFORM_BOOTSTRAP_SECOND_SUBJECT:}
